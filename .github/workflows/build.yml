name: Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Krf1Timing.sln

      - name: Build and create distribution zip
        run: .\_dist\createdist.ps1 -PlatformToolset v143
        shell: pwsh

      - name: Upload distribution zip
        uses: actions/upload-artifact@v4
        with:
          name: krf1-timing-dist
          path: _dist/*.zip
